<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Bé chọn game nè!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#fff8f0;
        --ink:#5b3a4a;
        --ink-soft:#8a5a6e;
        --card-border:#ffffff;
        --shadow:0 10px 0 rgba(91,58,74,.08), 0 18px 34px rgba(91,58,74,.14);
      }
      *{ box-sizing:border-box; }
      html,body{ height:100%; }
      body{
        margin:0;
        font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
        color:var(--ink);
        background:
          radial-gradient(circle at 12% 18%, rgba(255,183,197,.35) 0 52px, transparent 53px),
          radial-gradient(circle at 88% 12%, rgba(168,230,207,.45) 0 64px, transparent 65px),
          radial-gradient(circle at 92% 84%, rgba(255,224,138,.4) 0 56px, transparent 57px),
          radial-gradient(circle at 6% 88%, rgba(173,216,255,.35) 0 48px, transparent 49px),
          var(--bg);
        min-height:100dvh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:28px 18px 36px;
      }
      main{
        width:100%;
        max-width:480px;
        text-align:center;
      }
      h1{
        margin:0 0 26px;
        font-size:clamp(2rem, 9vw, 3rem);
        line-height:1.08;
        font-weight:800;
        letter-spacing:.01em;
        color:var(--ink);
      }
      h1 .heart{ color:#ff7aa2; display:inline-block; transform:translateY(2px); }
      .sub{
        margin:0 0 26px;
        font-size:1.08rem;
        font-weight:600;
        color:var(--ink-soft);
      }
      .games{
        display:flex;
        flex-direction:column;
        gap:18px;
      }
      .game-btn{
        display:flex;
        align-items:center;
        gap:16px;
        text-align:left;
        text-decoration:none;
        color:var(--ink);
        border:3px solid var(--card-border);
        border-radius:28px;
        padding:18px 20px 18px 16px;
        min-height:112px;
        box-shadow:var(--shadow);
        -webkit-tap-highlight-color:transparent;
        transition:transform .15s ease, box-shadow .15s ease;
        position:relative;
        overflow:hidden;
      }
      .game-btn::after{
        content:"›";
        position:absolute;
        right:18px;
        top:50%;
        transform:translateY(-54%);
        font-size:2.4rem;
        font-weight:800;
        line-height:1;
        opacity:.45;
      }
      .game-btn:active{ transform:scale(.975); }
      .game-btn:focus-visible{
        outline:4px solid #ff9ebb;
        outline-offset:3px;
      }
      @media (hover:hover){
        .game-btn:hover{ transform:translateY(-3px); }
      }
      .game-btn .icon{
        flex:0 0 auto;
        width:76px;
        height:76px;
        display:grid;
        place-items:center;
        background:rgba(255,255,255,.72);
        border-radius:22px;
        box-shadow:inset 0 0 0 2px rgba(255,255,255,.9), 0 4px 10px rgba(91,58,74,.08);
      }
      .game-btn .icon svg{ width:62px; height:62px; display:block; }
      .game-btn .name{
        font-size:clamp(1.3rem, 5.6vw, 1.6rem);
        font-weight:800;
        line-height:1.2;
        padding-right:22px;
      }
      .btn-garden{ background:linear-gradient(180deg,#e3f7d8,#cdeedd); }
      .btn-castle{ background:linear-gradient(180deg,#ffe3ef,#d9f2fb); }
      .btn-maze{ background:linear-gradient(180deg,#fff3c4,#ffe0d6); }
      .btn-hide{ background:linear-gradient(180deg,#eadcff,#ffd9ec); }

      @media (min-width:640px){
        .game-btn{ min-height:124px; padding:22px 24px 22px 20px; }
        .game-btn .icon{ width:88px; height:88px; }
        .game-btn .icon svg{ width:72px; height:72px; }
      }
      @media (min-width:768px){
        main{ max-width:880px; }
        .games{
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:18px;
        }
      }
      @media (prefers-reduced-motion: reduce){
        .game-btn{ transition:none; }
        .game-btn:active,.game-btn:hover{ transform:none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bé chọn game nè! <span class="heart" aria-hidden="true">♥</span></h1>

      <nav class="games" aria-label="Chọn game">
        <a class="game-btn btn-garden" href="https://koolart.net/game/khu-vuon-nho">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- tree canopy -->
              <circle cx="32" cy="18" r="13" fill="#5cb85c"/>
              <circle cx="20" cy="24" r="9" fill="#7cc96f"/>
              <circle cx="44" cy="24" r="9" fill="#7cc96f"/>
              <circle cx="26" cy="14" r="3" fill="#ff8fab"/>
              <circle cx="38" cy="12" r="2.6" fill="#ffd166"/>
              <circle cx="42" cy="20" r="2.6" fill="#ff8fab"/>
              <!-- trunk -->
              <path d="M29 28h6v10h-6z" fill="#a9744f"/>
              <!-- tree house -->
              <path d="M20 38 L32 30 L44 38 Z" fill="#e2607a"/>
              <rect x="23" y="38" width="18" height="13" rx="2" fill="#ffcf87"/>
              <rect x="29" y="42" width="6" height="9" rx="3" fill="#8a5a3b"/>
              <circle cx="32" cy="46.5" r="1.1" fill="#ffd166"/>
              <!-- ladder -->
              <path d="M26 51v7M38 51v7M26 54h12M26 57h12" stroke="#a9744f" stroke-width="2" stroke-linecap="round"/>
              <!-- grass -->
              <path d="M10 60c2-3 4-3 6 0 2-3 4-3 6 0 2-3 4-3 6 0 2-3 4-3 6 0 2-3 4-3 6 0 2-3 4-3 6 0" stroke="#5cb85c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="name">Khu vườn nhỏ của Bánh Mì</span>
        </a>

        <a class="game-btn btn-castle" href="https://koolart.net/game/nang-tien-ca">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- castle -->
              <rect x="24" y="26" width="16" height="20" rx="2" fill="#ffb3d1"/>
              <rect x="16" y="32" width="8" height="14" rx="2" fill="#ffc7dd"/>
              <rect x="40" y="32" width="8" height="14" rx="2" fill="#ffc7dd"/>
              <path d="M22 26 L32 14 L42 26 Z" fill="#6ec6e8"/>
              <path d="M14 32 L20 24 L26 32 Z" fill="#6ec6e8"/>
              <path d="M38 32 L44 24 L50 32 Z" fill="#6ec6e8"/>
              <path d="M32 14v-5" stroke="#8a5a3b" stroke-width="2" stroke-linecap="round"/>
              <path d="M32 9l6 2.2-6 2.2z" fill="#ff7aa2"/>
              <path d="M28 46v-6a4 4 0 0 1 8 0v6z" fill="#7a4a63"/>
              <rect x="29.5" y="31" width="5" height="6" rx="2.5" fill="#fff3a6"/>
              <!-- mermaid tail + waves -->
              <path d="M8 52c3-5 8-6 11-2 2 2.6 1 6-2 7 3 1 4 4 2 6-4 1-9-1-11-5-1-2-1-4 0-6z" fill="#3fbfae"/>
              <path d="M46 54c3-2 6-2 10 0M44 60c4-2 8-2 12 0" stroke="#6ec6e8" stroke-width="2.6" stroke-linecap="round"/>
              <circle cx="52" cy="46" r="2" fill="#bde8f7"/>
              <circle cx="57" cy="50" r="1.4" fill="#bde8f7"/>
              <path d="M12 44l1.2 2.6L16 48l-2.8 1.2L12 52l-1.2-2.8L8 48l2.8-1.4z" fill="#ffd166"/>
            </svg>
          </span>
          <span class="name">Lâu đài nàng tiên cá</span>
        </a>

        <a class="game-btn btn-maze" href="https://koolart.net/game/me-cung">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- rainbow -->
              <path d="M10 44a22 22 0 0 1 44 0" stroke="#ff7aa2" stroke-width="6" fill="none" stroke-linecap="round"/>
              <path d="M17 44a15 15 0 0 1 30 0" stroke="#ffb84d" stroke-width="6" fill="none" stroke-linecap="round"/>
              <path d="M24 44a8 8 0 0 1 16 0" stroke="#5cb85c" stroke-width="6" fill="none" stroke-linecap="round"/>
              <!-- clouds -->
              <g fill="#ffffff" stroke="#dbe9f5" stroke-width="1.6">
                <ellipse cx="11" cy="46" rx="8" ry="5.5"/>
                <ellipse cx="17" cy="43" rx="6" ry="5"/>
                <ellipse cx="53" cy="46" rx="8" ry="5.5"/>
                <ellipse cx="47" cy="43" rx="6" ry="5"/>
              </g>
              <!-- maze path -->
              <path d="M14 58h10v-5h10v5h16" stroke="#b08968" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/>
              <circle cx="14" cy="58" r="2.6" fill="#ff7aa2"/>
              <path d="M50 52l1.4 3 3.1.4-2.3 2.1.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.1 3.1-.4z" fill="#ffd166"/>
            </svg>
          </span>
          <span class="name">Mê cung cầu vồng</span>
        </a>

        <a class="game-btn btn-hide" href="https://koolart.net/game/tron-tim">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- candy house in the back -->
              <path d="M38 30 L48 20 L58 30 Z" fill="#e2607a"/>
              <path d="M38 30 L48 20 L58 30" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="41" y="30" width="14" height="12" rx="1.5" fill="#a9744f"/>
              <rect x="45.5" y="34" width="5" height="8" rx="2.5" fill="#5b3a2a"/>
              <circle cx="52" cy="26" r="2" fill="#ffd166"/>
              <!-- kid peeking from behind the bush -->
              <circle cx="22" cy="30" r="8.5" fill="#ffd9b8"/>
              <path d="M13.5 30a8.5 8.5 0 0 1 17 0c-2.5-1.8-4-4.4-4.6-7-1.2 1.8-2.6 3-4.4 3.6-2.4.8-5 .4-8-3.6z" fill="#8a5a3b"/>
              <circle cx="19" cy="31" r="1.3" fill="#5b3a4a"/>
              <circle cx="25" cy="31" r="1.3" fill="#5b3a4a"/>
              <path d="M20 35.5c1.2 1 2.8 1 4 0" stroke="#5b3a4a" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="15.5" cy="34.5" r="1.8" fill="#ffb3c6"/>
              <circle cx="28.5" cy="34.5" r="1.8" fill="#ffb3c6"/>
              <!-- bush -->
              <path d="M6 58c0-9 5-15 11-15 1.5-3.5 5-5.5 9-5.5s7.5 2 9 5.5c6 0 11 6 11 15z" fill="#5cb85c"/>
              <path d="M10 52c3-4 7-6 12-6M30 48c4 0 8 2 10 5" stroke="#7cc96f" stroke-width="2.4" stroke-linecap="round"/>
              <circle cx="14" cy="50" r="2.2" fill="#ff8fab"/>
              <circle cx="36" cy="52" r="2.2" fill="#ffd166"/>
              <circle cx="25" cy="55" r="2" fill="#ff8fab"/>
              <!-- lollipop -->
              <path d="M54 58V46" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
              <circle cx="54" cy="41" r="5" fill="#ff7aa2"/>
              <path d="M51 39a4 4 0 0 1 5 1" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="name">Ai Đang Trốn Thế?</span>
        </a>
      </nav>
    </main>
  </body>
</html>
