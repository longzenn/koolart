<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>YÊU GIỚI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Mali:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{touch-action:none;-webkit-user-select:none;user-select:none;background:#0d1b14;width:100%;height:100dvh;margin:0;font-family:Mali,cursive,sans-serif;overflow:hidden}#gb-shell,#gb-bezel{justify-content:center;align-items:center;width:100%;height:100%;display:flex}.gb-bezel-top,.gb-battery,.gb-bezel-logo,#pad{display:none}#game{justify-content:center;align-items:center;width:100%;height:100%;display:flex}canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}@media (width<=820px),(hover:none) and (pointer:coarse){body{background:#1a1c22;justify-content:center;align-items:stretch;display:flex}#gb-shell{width:100%;max-width:480px;height:100dvh;padding:env(safe-area-inset-top,8px) 12px env(safe-area-inset-bottom,10px);background:radial-gradient(circle at 20% 10%,#ffffff73,#0000 55%),linear-gradient(165deg,#dad5c6 0%,#cbc4b2 55%,#b8b09d 100%);border-left:3px solid #ece8dc;border-right:3px solid #968f7e;flex-direction:column;justify-content:flex-start;align-items:center;display:flex;position:relative;overflow:hidden;box-shadow:inset 0 2px 3px #ffffffb3,inset 0 -6px 12px #00000038,0 0 32px #000000bf}#gb-shell:before{content:"";background:linear-gradient(#a39b88 0%,#e6e2d6 100%);border-bottom:1px solid #948c7a;flex-shrink:0;width:calc(100% + 24px);height:6px;margin-bottom:6px}#gb-bezel{background:linear-gradient(155deg,#3b3948 0%,#2a2835 60%,#211f2b 100%);border:2px solid #1a1822;border-radius:14px 14px 36px;flex-direction:column;flex-shrink:0;align-items:center;width:100%;height:auto;padding:8px 14px 10px;display:flex;box-shadow:inset 0 2px 4px #ffffff24,inset 0 -3px 6px #0000008c,0 4px 10px #0000004d}.gb-bezel-top{align-items:center;gap:6px;width:100%;margin-bottom:5px;display:flex}.gb-stripe{border-top:2px solid #9e2a4b;border-bottom:2px solid #2b4c8c;flex:1;height:5px}.gb-bezel-title{letter-spacing:.8px;color:#b7b5c4;white-space:nowrap;font-family:sans-serif;font-size:8px;font-weight:700}.gb-screen-row{justify-content:center;align-items:center;gap:8px;width:100%;display:flex}.gb-battery{flex-direction:column;flex-shrink:0;align-items:center;gap:4px;width:22px;display:flex}.gb-battery-led{background:radial-gradient(circle at 35% 35%,#ff8a8a,#e61919 65%,#7a0808);border-radius:50%;width:9px;height:9px;box-shadow:0 0 8px #ff2a2a,0 0 3px #f77}.gb-battery-txt{color:#9e9cab;letter-spacing:.4px;font-family:sans-serif;font-size:7px;font-weight:700}#game{aspect-ratio:1;background:#0f2419;border:4px solid #161814;border-radius:6px;width:min(100% - 28px,47dvh);height:auto;position:relative;overflow:hidden;box-shadow:inset 0 2px 8px #000000bf,0 1px #ffffff1f}#game canvas{width:100%!important;height:100%!important;margin:0!important}.gb-bezel-logo{justify-content:center;align-items:baseline;gap:8px;width:100%;margin-top:6px;font-family:Coiny,sans-serif;display:flex}.gb-logo-main{letter-spacing:1.2px;color:#d8d4e6;text-shadow:0 1px 2px #000000b3;font-size:13px;font-style:italic}.gb-logo-color{letter-spacing:.5px;font-family:Mali,cursive,sans-serif;font-size:12px;font-weight:700}.gb-logo-color .c1{color:#e83858}.gb-logo-color .c2{color:#8c52ff}.gb-logo-color .c3{color:#38c864}.gb-logo-color .c4{color:#f2c029}.gb-logo-color .c5{color:#3498db}#pad{pointer-events:auto;flex-direction:column;flex:1;justify-content:space-between;width:100%;min-height:0;padding:10px 8px 4px;display:flex;position:relative}.gb-controls-main{flex:1;justify-content:space-between;align-items:center;width:100%;padding:0 6px;display:flex}#dpad{background:linear-gradient(145deg,#bfb8a6,#d4cebe);border-radius:50%;flex-shrink:0;width:146px;height:146px;position:relative;box-shadow:inset 0 2px 5px #00000038,0 1px 1px #ffffffa6}#dpad:before,#dpad:after{content:"";pointer-events:none;background:#27282e;border-radius:5px;position:absolute;box-shadow:0 4px #141519,0 5px 8px #00000073,inset 0 1px 1px #ffffff2e}#dpad:before{width:46px;height:122px;top:12px;left:50px}#dpad:after{width:122px;height:46px;top:50px;left:12px}.dpad-pivot{z-index:2;pointer-events:none;background:radial-gradient(circle at 60% 60%,#32343b,#1d1e23);border-radius:50%;width:30px;height:30px;position:absolute;top:58px;left:58px;box-shadow:inset 0 2px 4px #000000a6}#dpad button{color:#9698a3;z-index:3;cursor:pointer;background:0 0;border:none;border-radius:4px;justify-content:center;align-items:center;width:46px;height:46px;padding:0;font-size:16px;font-weight:700;display:flex;position:absolute}#dpad .u{top:10px;left:50px}#dpad .d{top:90px;left:50px}#dpad .l{top:50px;left:10px}#dpad .r{top:50px;left:90px}#dpad button.pressed,#dpad button:active{color:#f2c86a;background:#ffffff24;transform:translateY(2px)}#abtn{background:linear-gradient(145deg,#bab2a0,#d4cebe);border-radius:40px;flex-shrink:0;justify-content:space-around;align-items:center;width:148px;height:78px;padding:0 10px;display:flex;position:relative;transform:rotate(-24deg);box-shadow:inset 0 3px 6px #00000040,0 1px 1px #ffffffb3}.ab-wrap{flex-direction:column;align-items:center;display:flex;position:relative}#abtn button{color:#ffffffeb;cursor:pointer;background:radial-gradient(circle at 32% 28%,#c93b6b 0%,#9b1b47 65%,#6e1030 100%);border:2px solid #4a0a1f;border-radius:50%;justify-content:center;align-items:center;width:54px;height:54px;font-family:Coiny,sans-serif;font-size:19px;transition:transform 50ms,box-shadow 50ms;display:flex;position:static;box-shadow:0 4px #42081b,0 6px 10px #00000073,inset 0 2px 3px #ffffff59}#abtn button.pressed,#abtn button:active{transform:translateY(3px);box-shadow:0 1px #42081b,0 2px 4px #00000059,inset 0 2px 4px #0000004d}.ab-label{letter-spacing:1px;color:#303878;pointer-events:none;font-family:Coiny,sans-serif;font-size:14px;position:absolute;bottom:-22px}#sysbtn{z-index:3;justify-content:center;align-items:center;gap:28px;margin-bottom:6px;display:flex}.sys-item{flex-direction:column;align-items:center;gap:6px;display:flex}#sysbtn button{cursor:pointer;background:linear-gradient(#5e6068 0%,#3d3f46 100%);border:1.5px solid #25262b;border-radius:10px;width:56px;height:16px;padding:0;font-size:0;position:static;transform:rotate(-24deg);box-shadow:0 2px #1e1f24,0 3px 5px #00000059,inset 0 1px 1px #ffffff40}#sysbtn button.pressed,#sysbtn button:active{transform:rotate(-24deg)translateY(2px);box-shadow:0 0 #1e1f24,inset 0 1px 2px #00000080}.sys-label{letter-spacing:1px;color:#303878;margin-top:2px;font-family:sans-serif;font-size:10px;font-weight:800}.gb-speaker{pointer-events:none;opacity:.75;gap:6px;display:flex;position:absolute;bottom:10px;right:12px;transform:rotate(-26deg)}.gb-speaker span{background:#6c6659;border-radius:3px;width:5px;height:28px;box-shadow:inset 1px 1px 2px #000000a6,1px 0 #ffffff80}}@media (width<=820px) and (height<=700px){#game{width:min(100% - 28px,43dvh)}#dpad{width:128px;height:128px}#dpad:before{width:40px;height:108px;top:10px;left:44px}#dpad:after{width:108px;height:40px;top:44px;left:10px}.dpad-pivot{width:26px;height:26px;top:51px;left:51px}#dpad button{width:40px;height:40px;font-size:14px}#dpad .u{top:8px;left:44px}#dpad .d{top:80px;left:44px}#dpad .l{top:44px;left:8px}#dpad .r{top:44px;left:80px}#abtn{width:134px;height:70px}#abtn button{width:48px;height:48px;font-size:17px}}</style>
  <script type="module" crossorigin src="./assets/index-BEZMXUfI.js"></script>
</head>
<body>
  <div id="gb-shell">
    <!-- Phần trên: Mặt kính máy Game Boy + Màn hình tỉ lệ 1:1 -->
    <div id="gb-bezel">
      <div class="gb-bezel-top">
        <div class="gb-stripe"></div>
        <div class="gb-bezel-title">LINH KHÍ MATRIX · STEREO SOUND</div>
        <div class="gb-stripe"></div>
      </div>
      <div class="gb-screen-row">
        <div class="gb-battery">
          <div class="gb-battery-led"></div>
          <div class="gb-battery-txt">PIN</div>
        </div>
        <div id="game"></div>
      </div>
      <div class="gb-bezel-logo">
        <span class="gb-logo-main">GAME BOY</span>
        <span class="gb-logo-color">
          <span class="c1">Y</span><span class="c2">Ê</span><span class="c3">U</span>
          <span class="c4">G</span><span class="c5">I</span><span class="c1">Ớ</span><span class="c3">I</span>
        </span>
      </div>
    </div>

    <!-- Phần dưới: Cụm nút điều khiển phong cách máy Game Boy -->
    <div id="pad">
      <div class="gb-controls-main">
        <div id="dpad">
          <div class="dpad-pivot"></div>
          <button class="u" data-k="up" aria-label="Lên">▲</button>
          <button class="d" data-k="down" aria-label="Xuống">▼</button>
          <button class="l" data-k="left" aria-label="Trái">◀</button>
          <button class="r" data-k="right" aria-label="Phải">▶</button>
        </div>

        <div id="abtn">
          <div class="ab-wrap">
            <button class="b" data-k="back" aria-label="Nút B (Hủy)">B</button>
            <span class="ab-label">B</span>
          </div>
          <div class="ab-wrap">
            <button class="a" data-k="ok" aria-label="Nút A (Chọn)">A</button>
            <span class="ab-label">A</span>
          </div>
        </div>
      </div>

      <div id="sysbtn">
        <div class="sys-item">
          <button class="sel" data-k="run" aria-label="Chạy"></button>
          <span class="sys-label">SELECT · CHẠY</span>
        </div>
        <div class="sys-item">
          <button class="sta" data-k="menu" aria-label="Menu"></button>
          <span class="sys-label">START · MENU</span>
        </div>
      </div>

      <div class="gb-speaker" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>
</body>
</html>
