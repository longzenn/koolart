<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>YÊU GIỚI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Mali:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{touch-action:none;-webkit-user-select:none;user-select:none;background:#0d1b14;width:100%;height:100dvh;margin:0;font-family:Mali,cursive,sans-serif;overflow:hidden}#gb-shell{justify-content:center;align-items:center;width:100%;height:100%;display:flex}#pad{display:none}#game{justify-content:center;align-items:center;width:100%;height:100%;display:flex}canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}@media (width<=820px),(hover:none) and (pointer:coarse){body{background:#1a1c22;justify-content:center;align-items:stretch;display:flex}#gb-shell{background:radial-gradient(circle at 20% 60%,#ffffff73,#0000 55%),linear-gradient(165deg,#dad5c6 0%,#cbc4b2 55%,#b8b09d 100%);flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;max-width:520px;height:100dvh;padding:0;display:flex;position:relative;overflow:hidden}#game{aspect-ratio:1;background:#0f2419;border:none;border-radius:0;flex-shrink:0;width:100%;height:auto;max-height:58dvh;margin:0;padding:0;position:relative;overflow:hidden}#game canvas{width:100%!important;height:100%!important;margin:0!important}#pad{width:100%;min-height:0;padding:12px 16px calc(env(safe-area-inset-bottom,10px) + 8px);pointer-events:auto;border-top:3px solid #968f7e;flex-direction:column;flex:1;justify-content:space-between;display:flex;position:relative;box-shadow:inset 0 2px 3px #ffffffa6}.gb-controls-main{flex:1;justify-content:space-between;align-items:center;width:100%;padding:0 6px;display:flex}#dpad{background:linear-gradient(145deg,#bfb8a6,#d4cebe);border-radius:50%;flex-shrink:0;width:150px;height:150px;position:relative;box-shadow:inset 0 2px 5px #00000038,0 1px 1px #ffffffa6}#dpad:before,#dpad:after{content:"";pointer-events:none;background:#27282e;border-radius:5px;position:absolute;box-shadow:0 4px #141519,0 5px 8px #00000073,inset 0 1px 1px #ffffff2e}#dpad:before{width:46px;height:126px;top:12px;left:52px}#dpad:after{width:126px;height:46px;top:52px;left:12px}.dpad-pivot{z-index:2;pointer-events:none;background:radial-gradient(circle at 60% 60%,#32343b,#1d1e23);border-radius:50%;width:30px;height:30px;position:absolute;top:60px;left:60px;box-shadow:inset 0 2px 4px #000000a6}#dpad button{color:#9698a3;z-index:3;cursor:pointer;background:0 0;border:none;border-radius:4px;justify-content:center;align-items:center;width:46px;height:46px;padding:0;font-size:16px;font-weight:700;display:flex;position:absolute}#dpad .u{top:10px;left:52px}#dpad .d{top:94px;left:52px}#dpad .l{top:52px;left:10px}#dpad .r{top:52px;left:94px}#dpad button.pressed,#dpad button:active{color:#f2c86a;background:#ffffff24;transform:translateY(2px)}#abtn{background:linear-gradient(145deg,#bab2a0,#d4cebe);border-radius:40px;flex-shrink:0;justify-content:space-around;align-items:center;width:152px;height:80px;padding:0 10px;display:flex;position:relative;transform:rotate(-24deg);box-shadow:inset 0 3px 6px #00000040,0 1px 1px #ffffffb3}.ab-wrap{flex-direction:column;align-items:center;display:flex;position:relative}#abtn button{color:#ffffffeb;cursor:pointer;background:radial-gradient(circle at 32% 28%,#c93b6b 0%,#9b1b47 65%,#6e1030 100%);border:2px solid #4a0a1f;border-radius:50%;justify-content:center;align-items:center;width:56px;height:56px;font-family:Coiny,sans-serif;font-size:19px;transition:transform 50ms,box-shadow 50ms;display:flex;position:static;box-shadow:0 4px #42081b,0 6px 10px #00000073,inset 0 2px 3px #ffffff59}#abtn button.pressed,#abtn button:active{transform:translateY(3px);box-shadow:0 1px #42081b,0 2px 4px #00000059,inset 0 2px 4px #0000004d}.ab-label{letter-spacing:1px;color:#303878;pointer-events:none;font-family:Coiny,sans-serif;font-size:14px;position:absolute;bottom:-22px}#sysbtn{z-index:3;justify-content:center;align-items:center;gap:28px;margin-bottom:6px;display:flex}.sys-item{flex-direction:column;align-items:center;gap:6px;display:flex}#sysbtn button{cursor:pointer;background:linear-gradient(#5e6068 0%,#3d3f46 100%);border:1.5px solid #25262b;border-radius:10px;width:56px;height:16px;padding:0;font-size:0;position:static;transform:rotate(-24deg);box-shadow:0 2px #1e1f24,0 3px 5px #00000059,inset 0 1px 1px #ffffff40}#sysbtn button.pressed,#sysbtn button:active{transform:rotate(-24deg)translateY(2px);box-shadow:0 0 #1e1f24,inset 0 1px 2px #00000080}.sys-label{letter-spacing:1px;color:#303878;margin-top:2px;font-family:sans-serif;font-size:10px;font-weight:800}.gb-speaker{pointer-events:none;opacity:.75;gap:6px;display:flex;position:absolute;bottom:12px;right:14px;transform:rotate(-26deg)}.gb-speaker span{background:#6c6659;border-radius:3px;width:5px;height:28px;box-shadow:inset 1px 1px 2px #000000a6,1px 0 #ffffff80}}@media (width<=820px) and (height<=700px){#game{max-height:54dvh}#dpad{width:130px;height:130px}#dpad:before{width:40px;height:110px;top:10px;left:45px}#dpad:after{width:110px;height:40px;top:45px;left:10px}.dpad-pivot{width:26px;height:26px;top:52px;left:52px}#dpad button{width:40px;height:40px;font-size:14px}#dpad .u{top:8px;left:45px}#dpad .d{top:82px;left:45px}#dpad .l{top:45px;left:8px}#dpad .r{top:45px;left:82px}#abtn{width:136px;height:70px}#abtn button{width:48px;height:48px;font-size:17px}}</style>
  <script type="module" crossorigin src="./assets/index-BEZMXUfI.js"></script>
</head>
<body>
  <div id="gb-shell">
    <!-- Phần trên: Màn hình tỉ lệ 1:1 tràn viền full chiều ngang -->
    <div id="game"></div>

    <!-- Phần dưới: Cụm nút điều khiển phong cách máy Game Boy -->
    <div id="pad">
      <div class="gb-controls-main">
        <div id="dpad">
          <div class="dpad-pivot"></div>
          <button class="u" data-k="up" aria-label="Lên">▲</button>
          <button class="d" data-k="down" aria-label="Xuống">▼</button>
          <button class="l" data-k="left" aria-label="Trái">◀</button>
          <button class="r" data-k="right" aria-label="Phải">▶</button>
        </div>

        <div id="abtn">
          <div class="ab-wrap">
            <button class="b" data-k="back" aria-label="Nút B (Hủy)">B</button>
            <span class="ab-label">B</span>
          </div>
          <div class="ab-wrap">
            <button class="a" data-k="ok" aria-label="Nút A (Chọn)">A</button>
            <span class="ab-label">A</span>
          </div>
        </div>
      </div>

      <div id="sysbtn">
        <div class="sys-item">
          <button class="sel" data-k="run" aria-label="Chạy"></button>
          <span class="sys-label">SELECT · CHẠY</span>
        </div>
        <div class="sys-item">
          <button class="sta" data-k="menu" aria-label="Menu"></button>
          <span class="sys-label">START · MENU</span>
        </div>
      </div>

      <div class="gb-speaker" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>
</body>
</html>
